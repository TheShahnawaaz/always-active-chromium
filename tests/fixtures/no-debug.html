<!doctype html>
<meta charset="utf-8">
<title>Native visibility observation</title>
<h1>Native visibility observation</h1>
<p>This page only reads browser state and reports it to its own HTTP server.</p>
<script>
const configuration = __NO_DEBUG_CONFIGURATION__;
let sequence = 0;
let fullVersionList = [];
let versionError = null;
let versionStatus = 'pending';
async function report() {
  const observation = {
    run: configuration.run, page: configuration.page, sequence: ++sequence,
    elapsedMs: performance.now(), hidden: document.hidden,
    visibilityState: document.visibilityState, hasFocus: document.hasFocus(),
    webkitHidden: document.webkitHidden, webkitVisibilityState: document.webkitVisibilityState,
    webdriver: navigator.webdriver, userAgent: navigator.userAgent,
    fullVersionList, versionError, versionStatus
  };
  try {
    await fetch('/report', {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(observation),keepalive:true});
  } catch {}
}
report();
setInterval(report, 250);
(async () => {
  try {
    if (!navigator.userAgentData) throw Error('userAgentData_unavailable');
    const values = await navigator.userAgentData.getHighEntropyValues(['fullVersionList']);
    fullVersionList = Array.isArray(values.fullVersionList) ? values.fullVersionList.slice(0,16).map(value => ({brand:String(value.brand).slice(0,80),version:String(value.version).slice(0,80)})) : [];
    versionStatus = 'resolved';
  } catch (error) { versionStatus = 'error'; versionError = String(error.message).slice(0,160); }
  report();
})();
</script>
