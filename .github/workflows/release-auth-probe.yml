name: Verify final draft release permissions

on:
  workflow_dispatch:
    inputs:
      existing_tag:
        description: Pre-created ci-auth-probe tag at an older project commit
        type: string
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      AA_PROBE_TAG: ${{ inputs.existing_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create, upload, verify and remove a tiny draft at the existing tag
        run: python3 .github/scripts/probe-release-auth.py
