name: Build native Chromium

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Standard GitHub-hosted target
        type: choice
        options: [both, mac-arm64, win-x64]
        default: both
      build_ref:
        description: Immutable ci-source-<commit12> tag to build (blank uses this workflow commit)
        type: string
        default: ''
      bootstrap_only:
        description: Fetch source, hydrate tools, apply patch, generate GN, checkpoint; do not compile yet
        type: boolean
        default: false
      auto_resume:
        description: Dispatch the next bounded stage after a successful checkpoint
        type: boolean
        default: true
      migrate_native:
        description: Allow exact-hash native migration from the two explicitly approved seed refs
        type: boolean
        default: false
      stage:
        description: Continuation counter (leave 0 for a manual start/resume)
        type: number
        default: 0
      max_stages:
        description: Maximum consecutive stages, including this one (1–100)
        type: number
        default: 48

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} · stage ${{ inputs.stage }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'both' && '["mac-arm64","win-x64"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform == 'mac-arm64' && 'macos-26' || 'windows-2025-vs2026' }}
    timeout-minutes: 360
    concurrency:
      group: native-chromium-${{ matrix.platform }}
      cancel-in-progress: false
    permissions:
      contents: write # Draft diagnostics/checkpoints and final draft browser packages.
      actions: write # workflow_dispatch is the GITHUB_TOKEN recursion exception.
    env:
      GH_TOKEN: ${{ github.token }}
      AA_BUILD_REF: ${{ inputs.build_ref || github.sha }}
      AA_PLATFORM: ${{ matrix.platform }}
      AA_STAGE: ${{ inputs.stage }}
      AA_MAX_STAGES: ${{ inputs.max_stages }}
      AA_MIGRATE_NATIVE: ${{ inputs.migrate_native }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.build_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Start the six-hour job budget
        shell: bash
        run: python -c 'import os,time; open(os.environ["GITHUB_ENV"],"a").write("AA_JOB_STARTED="+str(time.time())+"\n")'
      - name: Require the immutable source reference before large downloads
        run: python ci/build.py source-ref --platform ${{ matrix.platform }} ${{ !inputs.bootstrap_only && '--require-final-ref' || '' }}
      - name: Install the small checkpoint codec
        run: python -m pip install --disable-pip-version-check -r ci/requirements.txt
      - name: Check the checkpoint format on this platform
        run: python -m unittest discover -s ci -p "test_*.py" -v
      - name: Prepare the ephemeral Mac runner
        if: matrix.platform == 'mac-arm64'
        shell: bash
        run: bash ci/runner-macos.sh
      - name: Prepare the ephemeral Windows runner and SDK
        if: matrix.platform == 'win-x64'
        shell: pwsh
        run: ./ci/runner-windows.ps1
      - name: Restore the last complete compiler checkpoint
        id: restore
        timeout-minutes: 60
        run: python ci/checkpoint.py restore --platform ${{ matrix.platform }} ${{ inputs.migrate_native && '--migrate-native' || '' }}
      - name: Verify source, tools, native patch, and GN configuration
        id: prepare
        timeout-minutes: 180
        run: python ci/build.py prepare --platform ${{ matrix.platform }}
      - name: Retain finite tool preflight diagnostics before the large checkpoint
        if: ${{ !cancelled() && steps.prepare.outcome != 'skipped' && hashFiles('ci/compile_diagnostics.py') != '' && hashFiles('.github/scripts/publish-build-diagnostics.py') != '' }}
        continue-on-error: true
        timeout-minutes: 10
        run: python .github/scripts/publish-build-diagnostics.py
        env:
          AA_DIAGNOSTIC_PHASE: prepare
          AA_PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
      - name: Audit declared leaf inputs without executing build commands
        id: audit
        # Older immutable campaigns may resume through this workflow definition.
        if: ${{ hashFiles('ci/audit_inputs.py') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: python ci/audit_inputs.py --source "$AA_BUILD_ROOT/src" --platform "${{ matrix.platform }}" --output "reports/${{ matrix.platform }}/input-audit.json"
      - name: Retain finite input diagnostics before the large checkpoint
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && hashFiles('.github/scripts/publish-build-diagnostics.py') != '' }}
        continue-on-error: true
        timeout-minutes: 10
        run: python .github/scripts/publish-build-diagnostics.py
        env:
          AA_AUDIT_OUTCOME: ${{ steps.audit.outcome }}
      - name: Compile until the checkpoint deadline
        id: compile
        if: ${{ steps.prepare.outcome == 'success' && (steps.audit.outcome == 'success' || (steps.audit.outcome == 'skipped' && hashFiles('ci/audit_inputs.py') == '')) }}
        continue-on-error: true
        run: python ci/build.py compile --platform ${{ matrix.platform }} ${{ inputs.bootstrap_only && '--bootstrap-only' || '' }}
      - name: Retain finite compiler diagnostics before the large checkpoint
        if: ${{ !cancelled() && steps.compile.outcome != 'skipped' && steps.compile.outcome != '' && hashFiles('ci/compile_diagnostics.py') != '' && hashFiles('.github/scripts/publish-build-diagnostics.py') != '' }}
        continue-on-error: true
        timeout-minutes: 10
        run: python .github/scripts/publish-build-diagnostics.py
        env:
          AA_DIAGNOSTIC_PHASE: compile
          AA_COMPILE_OUTCOME: ${{ steps.compile.outcome }}
      - name: Package the real browser
        id: package
        if: ${{ steps.compile.outputs.status == 'complete' }}
        run: python ci/build.py package --platform ${{ matrix.platform }}
      - name: Retain finite Mac signing diagnostics before the large checkpoint
        if: ${{ !cancelled() && matrix.platform == 'mac-arm64' && steps.package.outcome != 'skipped' && steps.package.outcome != '' && hashFiles('ci/mac_package.py') != '' }}
        continue-on-error: true
        timeout-minutes: 10
        run: python .github/scripts/publish-build-diagnostics.py
        env:
          AA_DIAGNOSTIC_PHASE: package
          AA_PACKAGE_OUTCOME: ${{ steps.package.outcome }}
      - name: Install the actual Windows package before core verification
        id: windows_install
        if: ${{ matrix.platform == 'win-x64' && steps.package.outcome == 'success' }}
        timeout-minutes: 8
        run: python ci/install_build.py
      - name: Verify native behavior, MV3 extensions, and zero-debugger operation
        id: tests
        if: ${{ steps.package.outcome == 'success' && (matrix.platform != 'win-x64' || steps.windows_install.outcome == 'success') }}
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        env:
          AA_BROWSER: ${{ steps.windows_install.outputs.browser || steps.package.outputs.browser || steps.prepare.outputs.browser }}
        run: python ci/verify.py --browser "$AA_BROWSER" --output "reports/${{ matrix.platform }}"
      - name: Upload packages, checksums, and selected evidence to a draft
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: python ci/publish.py --platform ${{ matrix.platform }} --test-outcome ${{ steps.tests.outcome }}
      - name: Save a complete resumable checkpoint
        id: checkpoint
        # Finished binaries/evidence are retained before the potentially long save.
        if: ${{ !cancelled() && steps.prepare.outputs.source_checkpointable == 'true' && !((steps.audit.outcome == 'failure' && steps.compile.outcome == 'skipped' || steps.compile.outputs.status == 'failed' && steps.compile.outputs.no_new_completed_actions == 'true') && steps.restore.outputs.restored == 'true' && steps.restore.outputs.native_migration_from == '') }}
        timeout-minutes: 120
        run: python ci/checkpoint.py save --platform ${{ matrix.platform }}
      - name: Continue with a fresh standard runner
        if: ${{ inputs.auto_resume && !inputs.bootstrap_only && steps.compile.outputs.status == 'pending' && steps.checkpoint.outcome == 'success' }}
        run: python ci/continue.py
      - name: Report unresolved build or browser test failure
        if: ${{ always() && (steps.audit.outcome == 'failure' || steps.compile.outcome == 'failure' || steps.windows_install.outcome == 'failure' || steps.tests.outcome == 'failure') }}
        shell: bash
        run: |
          echo 'The input audit, build, installation or browser tests failed; inspect finite diagnostics, logs and any retained compiler checkpoint.' >&2
          exit 1
